name: RC4 exact product integration gate
on:
  push:
    branches: ['release/rc4-final-verified']
  pull_request:
    branches: ['feature/rc3-final-correction-polish']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/release/rc4-final-verified' || github.head_ref == 'release/rc4-final-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm curl unzip ffmpeg libsdl2-2.0-0 libsdl2-ttf-2.0-0 libgl1
          python -m pip install Pillow
      - name: Frozen source and clean repeated builds
        run: |
          set -euxo pipefail
          LAB=72d2ca6fc6e8f2de96f4a1cb1b897d1e05b848c3
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$LAB" HEAD
          git diff --exit-code "$LAB" HEAD -- src tools tests graphics
          git diff --name-only "$LAB" HEAD | tee /tmp/rc4-diff.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/rc4-diff.txt').read_text().splitlines()
          assert paths and all(p=='README.md' or p.startswith('docs/') or p=='.github/workflows/rom-development.yml' for p in paths), paths
          PY
          mkdir -p /tmp/rc4-a /tmp/rc4-b build
          git archive HEAD | tar -x -C /tmp/rc4-a
          git archive HEAD | tar -x -C /tmp/rc4-b
          (cd /tmp/rc4-a && python tools/build_rc2.py build) | tee build/native_a.log
          (cd /tmp/rc4-b && python tools/build_rc2.py build) | tee build/native_b.log
          cp -a /tmp/rc4-a/build/. build/
          cp /tmp/rc4-diff.txt build/source_diff_paths.txt
          for tv in NTSC PAL; do
            cmp "build/SLUICE_PANIC_${tv}.bin" "/tmp/rc4-b/build/SLUICE_PANIC_${tv}.bin"
            cp "build/SLUICE_PANIC_${tv}.bin" "build/SLUICE_PANIC_RC4_${tv}.bin"
          done
          python - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('build'); rows=[]
          for line in pathlib.Path('docs/RC4_EXPECTED_HASHES.tsv').read_text().splitlines():
           tv,region,size,h=line.split('\t');data=(root/f'SLUICE_PANIC_RC4_{tv}.bin').read_bytes()
           assert len(data)==16384
           if region!='ROM':
            i=int(region[-1]);data=data[i*4096:(i+1)*4096]
            assert data==(root/f'{tv}_bank{i}.bin').read_bytes()
           assert len(data)==int(size) and hashlib.sha256(data).hexdigest()==h,(tv,region)
           rows.append(line)
          (root/'RC4_ROM_AND_BANK_HASHES.tsv').write_text('\n'.join(rows)+'\n')
          PY
          git rev-parse HEAD > build/source_commit.txt
          git archive --format=zip HEAD > build/source.zip
          dpkg-query -W dasm > build/tool_versions.txt
          cp -a docs build/docs
          cp README.md build/README.md
      - name: Stella actual gameplay smoke both formats
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o /tmp/stella-core.zip https://buildbot.libretro.com/nightly/linux/x86_64/latest/stella_libretro.so.zip
          unzip -o /tmp/stella-core.zip -d /tmp/stella-core
          sha256sum /tmp/stella-core/stella_libretro.so > build/stella_core.sha256
          for tv in NTSC PAL; do
            python tests/stella_libretro.py --core /tmp/stella-core/stella_libretro.so --rom "build/SLUICE_PANIC_RC4_$tv.bin" --sym "build/$tv.sym" --out "build/stella/$tv" --stress-frames 3600
          done
      - name: Gopher2600 actual deterministic smoke
        run: |
          set -euxo pipefail
          mkdir -p build/gopher
          curl -fsSL --retry 3 -o /tmp/gopher2600 https://github.com/JetSetIlly/Gopher2600/releases/download/v0.55.0/gopher2600_linux_amd64
          chmod +x /tmp/gopher2600
          sha256sum /tmp/gopher2600 > build/gopher/core.sha256
          /tmp/gopher2600 version | tee build/gopher/version.txt
          /tmp/gopher2600 regress add -frames 600 "$PWD/build/SLUICE_PANIC_RC4_NTSC.bin" | tee build/gopher/NTSC_add.log
          /tmp/gopher2600 regress add -frames 600 "$PWD/build/SLUICE_PANIC_RC4_PAL.bin" | tee build/gopher/PAL_add.log
          /tmp/gopher2600 regress run | tee build/gopher/run.log
          grep -Eiq '2 success' build/gopher/run.log
          grep -Eiq '0 fail' build/gopher/run.log
      - name: Record success and checksums
        run: |
          set -euxo pipefail
          printf '%s\n' 'PASS: two clean builds, source allowlist, all ROM/bank hashes, both actual Stella and Gopher smokes.' > build/CI_GATE_PASS.txt
          (cd build && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: SLUICE_PANIC_RC4_BUILD_EVIDENCE
          path: build/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: RC4_FAILED_DIAGNOSTICS
          path: build/
