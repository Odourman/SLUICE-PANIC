name: RC3 native checkpoint (diagnostic only)
on:
  pull_request:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4c3a0ffd39373f1ed2a7b6cdaab7287e8a180a6
      - uses: actions/checkout@v4
        with:
          ref: 50261be68d02bb6fbae63229c54a27cac847ccf8
          path: rc2-frozen
      - run: sudo apt-get update && sudo apt-get install -y dasm curl unzip ffmpeg
      - name: Native exact build and SHA proof
        run: |
          set -euxo pipefail
          mkdir -p build
          python tools/build_rc2.py build | tee build/build.log
          python tools/build_rc2.py rebuild
          cmp build/SLUICE_PANIC_NTSC.bin rebuild/SLUICE_PANIC_NTSC.bin
          cmp build/SLUICE_PANIC_PAL.bin rebuild/SLUICE_PANIC_PAL.bin
          (cd rc2-frozen && python tools/build_rc2.py build)
          mkdir -p build/rc2-baseline
          cp rc2-frozen/build/SLUICE*.bin rc2-frozen/build/*.sym build/rc2-baseline/
          echo 'a1375c014861c5b9d9efff844bcd617b5db6ce29aa3023299a9ba953213349c8  build/rc2-baseline/SLUICE_PANIC_NTSC.bin' | sha256sum -c
          echo 'f3a7f710225619fb89e3dd0ae74a2bbb4eeab3082f016edf93f5e26a96ac8302  build/rc2-baseline/SLUICE_PANIC_PAL.bin' | sha256sum -c
          git rev-parse HEAD > build/source_commit.txt
          git archive --format=zip HEAD > build/source.zip
          sha256sum build/SLUICE*.bin > build/SHA256SUMS.txt
          dpkg-query -W dasm > build/versions.txt
      - name: Real Stella input and simultaneous event regression
        run: |
          curl -fsSL --retry 3 -o /tmp/core.zip https://buildbot.libretro.com/nightly/linux/x86_64/latest/stella_libretro.so.zip
          unzip -o /tmp/core.zip -d /tmp/stella-core
          python tests/rc3_regression.py /tmp/stella-core/stella_libretro.so build | tee build/regression.log
      - name: Manifest
        if: always()
        run: (cd build && find . -type f ! -name ALL_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ALL_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc3-native-checkpoint
          path: build/
