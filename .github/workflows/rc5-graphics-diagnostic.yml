name: RC5 graphics R3 native and headless evidence
on:
  push:
    branches: [graphics/rc5-redesign-campaign]
    paths:
      - 'graphics/RC5/SLUICE_PANIC_RC5_GRAPHICS_II_R3.zip'
      - '.github/workflows/rc5-graphics-diagnostic.yml'
  workflow_dispatch:
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm
          python -m pip install Pillow
      - name: Extract and verify
        run: |
          mkdir -p rc5-graphics-output
          unzip -q graphics/RC5/SLUICE_PANIC_RC5_GRAPHICS_II_R3.zip -d rc5-graphics-output
          cd rc5-graphics-output
          sha256sum -c SHA256SUMS.txt
      - name: Native DASM two builds and CPU subset audit
        working-directory: rc5-graphics-output/src
        run: |
          set -eu
          mkdir -p ../build
          dpkg-query -W dasm > ../build/versions.txt
          for tv in 1 2; do
            if [ "$tv" = 1 ]; then region=NTSC; else region=PAL; fi
            for n in 1 2; do
              dasm diagnostic.asm -f3 -DTV=$tv -o../build/$region-$n.bank -l../build/$region-$n.lst -s../build/$region-$n.sym > ../build/$region-$n.log 2>&1 || { cat ../build/$region-$n.log; exit 1; }
              test "$(wc -c < ../build/$region-$n.bank)" = 4096
            done
            cmp ../build/$region-1.bank ../build/$region-2.bank
            for n in 1 2 3 4; do cat ../build/$region-1.bank; done > ../build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_$region.bin
            test "$(wc -c < ../build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_$region.bin)" = 16384
          done
          cp diagnostic_cpu_audit.py ../build/
          cd ../build
          sha256sum *.bin *.bank > ROM_SHA256SUMS.txt
          python diagnostic_cpu_audit.py
          python -c 'import json; r=json.load(open("CPU_MODEL_RESULTS.json")); assert all(set(k for x in z["frame_line_counts_by_stage"].values() for k in x)=={str(262 if z["region"]=="NTSC" else 312)} and not z["overrun_sites"] for z in r),r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC5-R3-native-DASM-build
          path: rc5-graphics-output/build/
      - name: Actual Stella libretro
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 2 -o /tmp/stella-core.zip https://buildbot.libretro.com/nightly/linux/x86_64/latest/stella_libretro.so.zip
          unzip -o /tmp/stella-core.zip -d /tmp/stella-core
          python graphics/RC5/stella_diagnostic.py
      - name: Gopher deterministic smoke
        timeout-minutes: 2
        run: |
          mkdir -p rc5-graphics-output/gopher
          curl -fsSL --retry 2 -o /tmp/gopher2600 https://github.com/JetSetIlly/Gopher2600/releases/download/v0.55.0/gopher2600_linux_amd64
          chmod +x /tmp/gopher2600
          /tmp/gopher2600 version | tee rc5-graphics-output/gopher/version.txt
          /tmp/gopher2600 regress add -frames 600 "$PWD/rc5-graphics-output/build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_NTSC.bin" | tee rc5-graphics-output/gopher/NTSC_add.log
          /tmp/gopher2600 regress add -frames 600 "$PWD/rc5-graphics-output/build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_PAL.bin" | tee rc5-graphics-output/gopher/PAL_add.log
          /tmp/gopher2600 regress run | tee rc5-graphics-output/gopher/run.log
          grep -Eiq '2 success' rc5-graphics-output/gopher/run.log
          grep -Eiq '0 fail' rc5-graphics-output/gopher/run.log
      - name: Manifest
        if: always()
        run: |
          cd rc5-graphics-output
          find . -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > EVIDENCE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC5-R3-diagnostic-evidence
          path: rc5-graphics-output/
