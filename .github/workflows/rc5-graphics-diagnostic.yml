name: RC5 graphics diagnostic (isolated)
on:
  push:
    branches: [graphics/rc5-redesign-campaign]
  workflow_dispatch:
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick
          python -m pip install Pillow
      - name: Extract and verify immutable design package
        run: |
          mkdir -p rc5-graphics-output
          unzip -q graphics/RC5/SLUICE_PANIC_RC5_GRAPHICS_II.zip -d rc5-graphics-output
          cd rc5-graphics-output
          sha256sum -c SHA256SUMS.txt
      - name: Native DASM dual-region builds
        working-directory: rc5-graphics-output/src
        run: |
          set -eu
          mkdir -p ../build
          dpkg-query -W dasm stella > ../build/versions.txt
          for tv in 1 2; do
            if [ "$tv" = 1 ]; then region=NTSC; else region=PAL; fi
            for n in 1 2; do
              dasm diagnostic.asm -f3 -DTV=$tv -o../build/$region-$n.bank -l../build/$region-$n.lst -s../build/$region-$n.sym > ../build/$region-$n.log 2>&1 || { cat ../build/$region-$n.log; exit 1; }
              test "$(wc -c < ../build/$region-$n.bank)" = 4096
            done
            cmp ../build/$region-1.bank ../build/$region-2.bank
            for n in 1 2 3 4; do cat ../build/$region-1.bank; done > ../build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_$region.bin
            test "$(wc -c < ../build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_$region.bin)" = 16384
          done
          cd ../build
          sha256sum *.bank *.bin > ROM_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RC5-native-DASM-build
          path: rc5-graphics-output/build/
      - name: Stella GUI capture (developer evidence only)
        timeout-minutes: 2
        working-directory: rc5-graphics-output
        run: |
          set -eu
          mkdir -p emulator/NTSC emulator/PAL
          for tv in NTSC PAL; do
            export TV="$tv"
            xvfb-run -a -s '-screen 0 1024x768x24' bash -c '
              set -eu
              export SDL_AUDIODRIVER=dummy
              stella -video software -fullscreen 0 -sound 0 -format "$TV" -type F6 -ss1x 1 -sssingle 0 -snapname rom -snapsavedir "$PWD/emulator/$TV" "$PWD/build/SLUICE_RC5_GRAPHICS_DIAGNOSTIC_$TV.bin" > "emulator/$TV/stella.log" 2>&1 &
              pid=$!
              trap "kill $pid 2>/dev/null || true" EXIT
              sleep 1
              win=$(xdotool search --onlyvisible --pid "$pid" | tail -1)
              timeout 5s xdotool windowfocus "$win" || true
              for n in $(seq 0 18); do
                import -window "$win" "emulator/$TV/frame_$n.png"
                sleep 0.65
              done
              xdotool key alt+l
              sleep 0.2
              import -window "$win" "emulator/$TV/stats.png"
              xdotool key alt+l
              xdotool key F12 || true
              sleep 0.3
              kill "$pid" || true
              wait "$pid" || true
            '
          done
      - name: Manifest of generated evidence
        if: always()
        run: |
          if [ -d rc5-graphics-output ]; then
            cd rc5-graphics-output
            find . -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > EVIDENCE_SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RC5-graphics-diagnostic-evidence
          path: rc5-graphics-output/
